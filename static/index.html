<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polyrag — multi-model RAG comparison</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --border:#2a2f3a; --text:#e6e8ee; --dim:#9aa3b2; --accent:#5eead4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:22px; margin:0 0 4px; } h1 span { color:var(--accent); }
  .sub { color:var(--dim); margin-bottom:24px; font-size:13.5px; }
  form { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  input[type=text] { flex:1; min-width:280px; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:12px 14px; border-radius:10px; font-size:15px; }
  button { background:var(--accent); color:#08211c; border:0; padding:12px 22px; border-radius:10px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .models { display:flex; gap:14px; color:var(--dim); font-size:13px; margin-bottom:22px; flex-wrap:wrap; }
  .models label { cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 2px; font-size:15px; color:var(--accent); }
  .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .answer { white-space:pre-wrap; font-size:14px; }
  .err { color:#f87171; }
  .sources { margin-top:22px; }
  .sources h2 { font-size:14px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .src { font-size:13px; color:var(--dim); padding:6px 0; border-top:1px solid var(--border); }
  .src a { color:var(--accent); text-decoration:none; }
  .badge { display:inline-block; background:#232836; border-radius:6px; padding:1px 7px; font-size:11px; margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>poly<span>rag</span></h1>
  <div class="sub">Same question, same retrieved context from real AI-governance documents — answered side-by-side by different models. Citations like [2] point at the shared source list below.</div>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. What obligations does the EU AI Act place on providers of high-risk AI systems?" required>
    <button id="go" type="submit">Compare</button>
  </form>
  <div class="models" id="models"></div>
  <div class="grid" id="grid"></div>
  <div class="sources" id="sources"></div>
</div>
<script>
const modelsDiv = document.getElementById('models');
const grid = document.getElementById('grid');
const sourcesDiv = document.getElementById('sources');
const defaults = new Set(['llama','gpt-oss']);

fetch('/models').then(r => r.json()).then(list => {
  modelsDiv.innerHTML = list.filter(m => m.alias !== 'mock').map(m =>
    `<label><input type="checkbox" value="${m.alias}" ${defaults.has(m.alias) ? 'checked' : ''} ${m.ready ? '' : ''}> ${m.alias} <span class="badge">${m.provider}</span></label>`
  ).join('');
});

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const models = [...modelsDiv.querySelectorAll('input:checked')].map(i => i.value);
  if (!models.length) return;
  btn.disabled = true; grid.innerHTML = '<div class="card">Retrieving + querying ' + models.length + ' model(s)…</div>'; sourcesDiv.innerHTML = '';
  try {
    const res = await fetch('/compare', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: document.getElementById('q').value, models })});
    const data = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(data.detail || data));
    grid.innerHTML = data.results.map(r => r.model.error
      ? `<div class="card"><h3>${r.model.model_alias}</h3><div class="err">${r.model.error}</div></div>`
      : `<div class="card"><h3>${r.model.model_alias}</h3>
           <div class="meta">${r.model.model_id} · ${r.model.latency_s.toFixed(2)}s · citation coverage ${(r.citation_coverage*100).toFixed(0)}%</div>
           <div class="answer">${r.answer.replace(/</g,'&lt;')}</div></div>`).join('');
    const srcs = data.results[0]?.sources || [];
    sourcesDiv.innerHTML = '<h2>Shared retrieved context</h2>' + srcs.map(s =>
      `<div class="src">[${s.n}] <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>${s.page ? ' — p.'+s.page : ''}<span class="badge">${s.extraction}</span> score ${s.score.toFixed(3)}</div>`).join('');
  } catch (err) {
    grid.innerHTML = `<div class="card err">${err.message}</div>`;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
