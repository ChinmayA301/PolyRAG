name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Core deps only — CI runs on the hashing embedder and mock provider,
      # so no model weights download and no API keys are needed.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
